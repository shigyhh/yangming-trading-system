<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>阳明心学交易体验营｜报名结果</title>
    <style>
      :root {
        --ink: #eae4d2;
        --muted: rgba(234, 228, 210, 0.72);
        --faint: rgba(234, 228, 210, 0.5);
        --gold: #c6a867;
        --gold-bright: #e0c488;
        --gold-deep: #9c7e45;
        --line: rgba(198, 168, 103, 0.22);
        --panel: rgba(7, 13, 9, 0.66);
        --font: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "PingFang SC", "Microsoft YaHei", serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        margin: 0;
        overflow-x: hidden;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 20px 16px;
        background:
          radial-gradient(100% 70% at 50% 0%, rgba(198, 168, 103, 0.12), transparent 54%),
          radial-gradient(120% 88% at 50% 100%, rgba(112, 24, 18, 0.38), transparent 62%),
          linear-gradient(180deg, #06100b 0%, #0a130e 48%, #180d0b 100%);
        color: var(--ink);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .page {
        width: min(100%, 520px);
      }

      .panel {
        border-radius: 22px;
        padding: 24px 18px;
        background:
          radial-gradient(90% 70% at 50% 0%, rgba(224, 196, 136, 0.1), transparent 62%),
          var(--panel);
        border: 1px solid var(--line);
        box-shadow:
          0 24px 80px rgba(0, 0, 0, 0.34),
          inset 0 0 0 1px rgba(224, 196, 136, 0.04);
        backdrop-filter: blur(10px);
        text-align: center;
      }

      .seal {
        width: 82px;
        height: 82px;
        display: grid;
        place-items: center;
        margin: 0 auto 12px;
        border-radius: 50%;
        border: 1px solid rgba(224, 196, 136, 0.72);
        background:
          radial-gradient(circle at 50% 42%, rgba(224, 196, 136, 0.09), transparent 62%),
          rgba(7, 13, 9, 0.72);
        box-shadow:
          0 0 0 8px rgba(198, 168, 103, 0.05),
          0 0 28px rgba(224, 196, 136, 0.18),
          inset 0 0 24px rgba(198, 168, 103, 0.1);
        overflow: hidden;
      }

      .seal img {
        width: 66px;
        height: 66px;
        display: block;
        object-fit: contain;
        background: transparent;
      }

      h1 {
        margin: 0;
        color: var(--gold-bright);
        font-size: 25px;
        line-height: 1.25;
        letter-spacing: 0.03em;
      }

      .subtitle {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .locked {
        margin-top: 18px;
        border-radius: 16px;
        padding: 18px 14px;
        background: rgba(0, 0, 0, 0.16);
        border: 1px solid var(--line);
      }

      .locked strong {
        display: block;
        margin-bottom: 6px;
        color: var(--gold-bright);
        font-size: 18px;
      }

      .locked span {
        color: var(--muted);
        line-height: 1.7;
      }

      .entrance {
        margin-top: 18px;
      }

      .qr-wrap {
        display: none;
        margin: 0 auto 12px;
        width: min(76vw, 260px);
        min-height: 160px;
        border-radius: 18px;
        padding: 12px;
        background: #fff;
        border: 1px solid rgba(224, 196, 136, 0.34);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.24);
      }

      .qr-wrap img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 10px;
      }

      .remark {
        margin: 8px 0 0;
        color: var(--gold);
        font-size: 14px;
      }

      .btn {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 14px;
        border: 0;
        border-radius: 13px;
        padding: 12px 16px;
        color: #11150d;
        background: linear-gradient(180deg, var(--gold-bright), var(--gold-deep));
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 14px 34px rgba(224, 196, 136, 0.2);
      }

      .btn[hidden],
      [hidden] {
        display: none !important;
      }

      .risk {
        margin: 14px 0 0;
        color: var(--faint);
        font-size: 12px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <div class="seal" aria-label="照字标识"><img src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22240%22%20height%3D%22240%22%20viewBox%3D%2232%2028%20208%20216%22%20role%3D%22img%22%20aria-label%3D%22%E7%85%A7%22%3E%0A%20%20%3Cg%20fill%3D%22none%22%20stroke%3D%22%23E0C488%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%20%20%20%20%3Cpath%20d%3D%22M55%2040H119V123H55Z%22%20stroke-width%3D%229%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M68%2068H107M68%2096H107%22%20stroke-width%3D%225%22%20opacity%3D%22.78%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M154%2042H214%22%20stroke-width%3D%229%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M184%2044C180%2068%20167%2088%20146%20104%22%20stroke-width%3D%229%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M154%2084H217V123H154Z%22%20stroke-width%3D%229%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M166%20104H206%22%20stroke-width%3D%224.8%22%20opacity%3D%22.76%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M70%20151H209%22%20stroke-width%3D%226.4%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M72%20184C63%20200%2057%20213%2050%20228M114%20183C108%20199%20105%20214%20102%20231M156%20183C160%20199%20163%20214%20166%20231M197%20184C206%20200%20215%20214%20222%20228%22%20stroke-width%3D%226.6%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E" alt="" /></div>
        <h1 id="pageTitle">正在核验报名状态</h1>
        <p class="subtitle" id="pageSubtitle">请稍候，系统会先确认订单是否已支付。</p>

        <div class="locked" id="lockedPanel" hidden>
          <strong>入口未解锁</strong>
          <span>订单未完成支付，暂不展示课程助教二维码或获客助手链接。</span>
        </div>

        <div class="entrance" id="entrancePanel" hidden>
          <div class="qr-wrap" id="qrWrap">
            <img id="qrImage" alt="课程助教二维码" />
          </div>
          <p class="subtitle" id="entranceText">长按识别二维码，添加课程助教</p>
          <p class="remark" id="remarkText"></p>
          <a class="btn" id="wecomButton" href="#" rel="noopener">如未自动跳转，点击添加课程助教</a>
        </div>

        <p class="risk">
          本课程仅用于投资教育、交易纪律训练、模拟盘训练和风险意识教育，不构成证券投资咨询、投资建议或买卖依据。
        </p>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const order_id = params.get("order_id") || "";
      const token = params.get("token") || "";

      const pageTitle = document.getElementById("pageTitle");
      const pageSubtitle = document.getElementById("pageSubtitle");
      const lockedPanel = document.getElementById("lockedPanel");
      const entrancePanel = document.getElementById("entrancePanel");
      const qrWrap = document.getElementById("qrWrap");
      const qrImage = document.getElementById("qrImage");
      const entranceText = document.getElementById("entranceText");
      const remarkText = document.getElementById("remarkText");
      const wecomButton = document.getElementById("wecomButton");

      function showLocked(message) {
        pageTitle.textContent = "入口未解锁";
        pageSubtitle.textContent = message || "请先完成支付，再返回本页查看课程助教入口。";
        pageSubtitle.hidden = false;
        lockedPanel.hidden = false;
        entrancePanel.hidden = true;
        qrImage.removeAttribute("src");
        wecomButton.hidden = true;
      }

      function showEmptyEntrance() {
        pageTitle.textContent = "助教入口配置中";
        pageSubtitle.textContent = "助教入口配置中，请联系管理员";
        pageSubtitle.hidden = false;
        lockedPanel.hidden = true;
        entrancePanel.hidden = false;
        qrWrap.style.display = "none";
        entranceText.textContent = "助教入口配置中，请联系管理员";
        remarkText.textContent = "";
        wecomButton.hidden = true;
      }

      function renderEntrance(livecode) {
        const wecom_link = livecode.wecom_link || "";
        const qr_image = livecode.qr_image || "";
        const autoRedirect = livecode.auto_redirect === true || livecode.auto_redirect_after_paid === true;
        const redirect_delay_ms = Number(livecode.redirect_delay_ms || 0);

        if (!wecom_link && !qr_image) {
          showEmptyEntrance();
          return;
        }

        pageTitle.textContent = "报名成功，入口已解锁";
        pageSubtitle.hidden = true;
        lockedPanel.hidden = true;
        entrancePanel.hidden = false;

        if (qr_image) {
          qrImage.src = qr_image;
          qrWrap.style.display = "block";
          entranceText.textContent = "长按识别二维码，添加课程助教";
        } else {
          qrImage.removeAttribute("src");
          qrWrap.style.display = "none";
          entranceText.textContent = "点击按钮添加课程助教";
        }

        remarkText.textContent = livecode.remark ? `加微备注：${livecode.remark}` : "";

        if (wecom_link) {
          wecomButton.href = wecom_link;
          wecomButton.textContent = livecode.button_text || "如未自动跳转，点击添加课程助教";
          wecomButton.hidden = false;
        } else {
          wecomButton.hidden = true;
        }

        if (autoRedirect && wecom_link) {
          entranceText.textContent = "正在跳转企业微信获客助手";
          wecomButton.textContent = "如未自动跳转，点击添加课程助教";
          window.setTimeout(() => {
            window.location.href = wecom_link;
          }, Math.max(0, redirect_delay_ms));
        }
      }

      async function fetchJson(url) {
        const response = await fetch(url, {
          headers: { Accept: "application/json" },
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || "request failed");
        return data;
      }

      async function boot() {
        if (!order_id || !token) {
          showLocked("缺少订单参数，无法核验报名状态。");
          return;
        }

        try {
          const query = new URLSearchParams({ order_id, token }).toString();
          const statusData = await fetchJson(`/api/order/status?${query}`);
          if (!statusData.order || statusData.order.pay_status !== "paid") {
            showLocked("订单尚未完成支付，课程助教入口暂未解锁。");
            return;
          }

          const entranceData = await fetchJson(`/api/afterpay/entrance?${query}`);
          renderEntrance(entranceData.livecode || {});
        } catch {
          showLocked("暂时无法核验订单，请稍后刷新重试。");
        }
      }

      boot();
    </script>
  </body>
</html>
